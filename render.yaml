# Render Blueprint（可选）：也可以直接在 Render 控制台按下列参数手动创建
services:
  - type: web
    name: hs300-chart
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COOKIE_SECURE
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hs300-db
          property: connectionString
databases:
  - name: hs300-db
    plan: free
    region: singapore
